<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comment Readerr</title>

  <!-- Preconnect for faster CDN loading -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />

  <!-- PRODUCTION builds: much smaller & faster than development builds -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script>window.tailwind = { config: { suppressDeprecationWarnings: true } };</script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body { background-color: #F4F8FA; }
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .animate-fade-up { animation: fadeInUp 0.35s ease-out both; }
    @keyframes pulseGlow { 0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.35);} 50%{box-shadow:0 0 0 8px rgba(249,115,22,0);} }
    .analyze-pulse:hover { animation: pulseGlow 1.2s ease-out infinite; }
    @keyframes spinSlow { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
    .spin-slow { animation: spinSlow 1.6s linear infinite; }
    @keyframes checkPop { 0%{transform:scale(.4);opacity:0;} 60%{transform:scale(1.15);opacity:1;} 100%{transform:scale(1);opacity:1;} }
    .check-pop { animation: checkPop 0.4s ease-out both; }
    .brand-hover { transition: all 0.3s ease; }
    .brand-hover:hover { background:linear-gradient(90deg,#C0C0C0,#FFD700,#C0C0C0); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 6px rgba(250,204,21,.5)); }
    .scrollbar-thin::-webkit-scrollbar{width:6px;} .scrollbar-thin::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:999px;}
    .filter-btn { transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s; }
    .filter-btn:hover { transform: scale(1.07); }
   .filter-btn.active { outline: 2px solid rgba(30,41,59,0.75); outline-offset: 2px; box-shadow: 0 0 0 3px rgba(30,41,59,0.5); opacity: 1 !important; }
    @media(prefers-reduced-motion:reduce){.animate-fade-up,.analyze-pulse:hover,.spin-slow,.check-pop{animation:none!important;}}
    @media print {
      .print\:hidden { display:none !important; }
      body { background:#fff !important; }
      .max-h-\[600px\] { max-height:none !important; overflow:visible !important; }
      .sticky { position:static !important; }
    }
  </style>
</head>
<body class="bg-[#F4F8FA] text-[#1E293B] min-h-screen">
<div id="root"></div>

<script type="text/babel">
  const { useState, useMemo, useEffect, useRef, useCallback } = React;
  const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Cell } = window.Recharts || {};

  // ── CONFIG ──────────────────────────────────────────────────────────
  const API_BASE = "https://comment-rederr-production.up.railway.app/v1";

  // FIXED: these category keys must match exactly what Gemini returns
  const CATEGORY_META = {
    all:         { label: "👁️ ALL",         base: "#0284C7" },
    positive:    { label: "🙂 POSITIVE",    base: "#059669" },
    critical:    { label: "⚠️ CRITICAL",    base: "#B91C1C" },
    questions:   { label: "❓ QUESTIONS",   base: "#4338CA" },
    suggestions: { label: "💡 SUGGESTIONS", base: "#D97706" },
    urgent:      { label: "🚨 URGENT",      base: "#EA580C" },
    business:    { label: "💸 BUSINESS",    base: "#047857" },
    spam:        { label: "😡 SPAM/HATE",   base: "#DC2626" },
    sarcasm:     { label: "🤡 SARCASM",     base: "#7C3AED" },
    neutral:     { label: "⬜ NEUTRAL",     base: "#64748B" },
  };

  const CATEGORY_COLORS = {
    positive:"#059669", critical:"#B91C1C", questions:"#4338CA",
    suggestions:"#D97706", urgent:"#EA580C", business:"#047857",
    spam:"#DC2626", sarcasm:"#7C3AED", neutral:"#64748B",
  };

  // Colors for the word cloud — cycles through these for visual variety
  const CLOUD_COLORS = ["#0EA5E9","#F97316","#059669","#7C3AED","#DC2626","#0284C7","#D97706","#4338CA"];

  // ── PERSISTENCE HELPERS (bookmarks / whitelist / blacklist) ───────────
  function loadSet(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch { return new Set(); }
  }
  function saveSet(key, set) {
    try { localStorage.setItem(key, JSON.stringify(Array.from(set))); } catch {}
  }

  // ── EXPORT HELPERS ─────────────────────────────────────────────────
  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function csvEscape(v) {
    const s = String(v ?? "");
    return `"${s.replace(/"/g, '""')}"`;
  }

  // ── SEARCH HIGHLIGHT ────────────────────────────────────────────────
  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function highlightMatch(text, query) {
    if (!query || !query.trim()) return text;
    const parts = String(text || "").split(new RegExp(`(${escapeRegExp(query.trim())})`, "gi"));
    return parts.map((part, i) =>
      part.toLowerCase() === query.trim().toLowerCase()
        ? <mark key={i} className="bg-yellow-200 text-slate-900 rounded px-0.5">{part}</mark>
        : part
    );
  }


  // ── HEADER ──────────────────────────────────────────────────────────
  function Header({ view, onReset }) {
    return (
      <header className="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
        <div className="max-w-7xl mx-auto px-3 md:px-6 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-2 cursor-pointer brand-hover" onClick={onReset}>
            <span className="text-2xl" style={{color:"#0EA5E9"}}>📊</span>
            <span className="font-extrabold tracking-tight text-lg md:text-xl">
              <span style={{color:"#0EA5E9"}}>COMMENT</span>{" "}
              <span style={{color:"#1E293B"}}>READERR</span>
            </span>
          </div>
          {view === "results" && (
            <button onClick={onReset} className="print:hidden bg-[#FACC15] text-slate-900 font-medium text-sm px-4 py-2 rounded-lg hover:bg-[#D97706] hover:text-white transition-colors">
              ＋ Analyze Another
            </button>
          )}
        </div>
      </header>
    );
  }

  // ── HOME VIEW ───────────────────────────────────────────────────────
  function HomeView({ onAnalyze }) {
    const [url, setUrl] = useState("");
    const features = [
      { icon:"📈", title:"Core Analytics", desc:"Views, likes, growth and engagement ratio at a glance." },
      { icon:"🧭", title:"Sentiment Categories", desc:"Positive, critical, questions, spam and more — auto-tagged by AI." },
      { icon:"💬", title:"Discussion Insights", desc:"Surface urgent issues, business leads and top viewer requests." },
    ];
    return (
      <div className="max-w-5xl mx-auto px-4 md:px-6 py-12 md:py-20 animate-fade-up">
        <div className="text-center mb-10">
          <h1 className="text-3xl md:text-5xl font-extrabold leading-tight text-[#1E293B] mb-4">
            Analyze Any YouTube Video's <span style={{color:"#0EA5E9"}}>Audience Feedback</span> in Seconds
          </h1>
          <p className="text-slate-500 text-sm md:text-lg max-w-2xl mx-auto">
            Paste a link, and Comment Readerr sorts every comment into the categories that actually matter.
          </p>
        </div>
        <div className="flex flex-col sm:flex-row items-stretch gap-3 max-w-2xl mx-auto mb-14">
          <div className="relative flex-1">
            <input type="text" value={url} onChange={e=>setUrl(e.target.value)}
              onKeyDown={e=>e.key==="Enter" && url.trim() && onAnalyze(url.trim())}
              placeholder="Paste YouTube URL here..."
              className="w-full bg-white border-2 border-[#10B981] rounded-xl px-4 py-3 pr-10 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-shadow" />
            {url && (
              <button onClick={()=>setUrl("")} aria-label="Clear"
                className="absolute right-3 top-1/2 -translate-y-1/2 text-[#9CA3AF] hover:text-[#EF4444] font-bold">✕</button>
            )}
          </div>
          <button onClick={()=>url.trim()&&onAnalyze(url.trim())}
            className="analyze-pulse bg-[#F97316] text-white font-bold px-6 py-3 rounded-xl hover:bg-[#EA580C] transition-colors whitespace-nowrap">
            ANALYZE 📊
          </button>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
          {features.map((f,i)=>(
            <div key={i} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow">
              <div className="text-3xl mb-3">{f.icon}</div>
              <h3 className="font-bold text-base mb-1">{f.title}</h3>
              <p className="text-slate-500 text-sm">{f.desc}</p>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ── LOADING VIEW ─────────────────────────────────────────────────────
  function LoadingView({ progress }) {
    const steps = [
      "Fetching public video comments...",
      "Running NLP sentiment analysis...",
      "Extracting viewer questions & suggestions...",
      "Building interactive dashboard...",
    ];
    const currentStep = progress?.step || 1;
    return (
      <div className="max-w-md mx-auto px-4 py-24 md:py-32 text-center animate-fade-up">
        <div className="text-5xl mb-6 spin-slow inline-block">📊</div>
        <h2 className="text-xl md:text-2xl font-bold mb-8 text-[#1E293B]">Analyzing your video...</h2>
        <div className="space-y-4 text-left">
          {steps.map((s,i)=>{
            const stepNum = i+1;
            const done = stepNum < currentStep;
            const active = stepNum === currentStep;
            return (
              <div key={i} className="flex items-center gap-3">
                <span className={"flex items-center justify-center w-6 h-6 rounded-md border-2 text-xs font-bold shrink-0 "+(done?"bg-emerald-500 border-emerald-500 text-white check-pop":active?"border-[#0EA5E9] text-[#0EA5E9]":"border-slate-300 text-slate-300")}>
                  {done?"✓":""}
                </span>
                <span className={"text-sm "+(done?"text-slate-700":active?"text-[#1E293B] font-medium":"text-slate-400")}>{s}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── ERROR VIEW ───────────────────────────────────────────────────────
  function ErrorView({ message, onReset }) {
    return (
      <div className="max-w-md mx-auto px-4 py-24 md:py-32 text-center animate-fade-up">
        <div className="text-6xl mb-6">⚠️</div>
        <h2 className="text-xl md:text-2xl font-bold mb-2">Couldn't load that video</h2>
        <p className="text-slate-500 text-sm mb-8">{message || "The link may be private, invalid, or age-restricted."}</p>
        <button onClick={onReset} className="bg-[#F97316] text-white font-bold px-6 py-3 rounded-xl hover:bg-[#EA580C] transition-colors">
          Try Another Link
        </button>
      </div>
    );
  }

  // ── RESULTS VIEW ─────────────────────────────────────────────────────
  function ResultsView({ jobId, data }) {
    const [filter, setFilter] = useState("all");
    const [showMetrics, setShowMetrics] = useState(true);
    const [comments, setComments] = useState(data.comments || []);

    // Bookmarks (per comment) + Whitelist/Blacklist (per username) — persisted locally
    const [bookmarked, setBookmarked] = useState(() => loadSet("cr_bookmarks"));
    const [whitelist, setWhitelist] = useState(() => loadSet("cr_whitelist"));
    const [blacklist, setBlacklist] = useState(() => loadSet("cr_blacklist"));
    const [showBookmarkedOnly, setShowBookmarkedOnly] = useState(false);
    const [hideBlacklisted, setHideBlacklisted] = useState(false);
    const [searchQuery, setSearchQuery] = useState("");
    const [showExportMenu, setShowExportMenu] = useState(false);

    const toggleBookmark = (commentId) => {
      setBookmarked(prev => {
        const next = new Set(prev);
        next.has(commentId) ? next.delete(commentId) : next.add(commentId);
        saveSet("cr_bookmarks", next);
        return next;
      });
    };
    const addToWhitelist = (user) => {
      setBlacklist(prev => { if (!prev.has(user)) return prev; const n = new Set(prev); n.delete(user); saveSet("cr_blacklist", n); return n; });
      setWhitelist(prev => { const n = new Set(prev); n.add(user); saveSet("cr_whitelist", n); return n; });
    };
    const addToBlacklist = (user) => {
      setWhitelist(prev => { if (!prev.has(user)) return prev; const n = new Set(prev); n.delete(user); saveSet("cr_whitelist", n); return n; });
      setBlacklist(prev => { const n = new Set(prev); n.add(user); saveSet("cr_blacklist", n); return n; });
    };
    const removeFromWhitelist = (user) => setWhitelist(prev => { const n=new Set(prev); n.delete(user); saveSet("cr_whitelist", n); return n; });
    const removeFromBlacklist = (user) => setBlacklist(prev => { const n=new Set(prev); n.delete(user); saveSet("cr_blacklist", n); return n; });

    // Per-username stats — used to auto-suggest repeat spammers vs loyal viewers
    const userStats = useMemo(() => {
      const map = new Map();
      for (const c of comments) {
        const u = c.user || "Unknown";
        if (!map.has(u)) map.set(u, { count: 0, spam: 0, positive: 0 });
        const s = map.get(u);
        s.count++;
        if (c.category === "spam") s.spam++;
        if (c.category === "positive") s.positive++;
      }
      return map;
    }, [comments]);

    const suggestedSpammers = useMemo(() =>
      Array.from(userStats.entries())
        .filter(([u, s]) => s.spam >= 2 && !blacklist.has(u))
        .map(([user, s]) => ({ user, ...s }))
        .sort((a, b) => b.spam - a.spam)
        .slice(0, 6),
      [userStats, blacklist]
    );
    const suggestedLoyal = useMemo(() =>
      Array.from(userStats.entries())
        .filter(([u, s]) => s.count >= 3 && s.positive >= 2 && !whitelist.has(u))
        .map(([user, s]) => ({ user, ...s }))
        .sort((a, b) => b.count - a.count)
        .slice(0, 6),
      [userStats, whitelist]
    );

    // FIXED: Count per category so filter buttons show how many comments each has
    const categoryCounts = useMemo(() => {
      const counts = { all: comments.length };
      for (const c of comments) {
        counts[c.category] = (counts[c.category] || 0) + 1;
      }
      return counts;
    }, [comments]);

    const filtered = useMemo(() => {
      let list = filter === "all" ? comments : comments.filter(c => c.category === filter);
      if (showBookmarkedOnly) list = list.filter(c => bookmarked.has(c.id));
      if (hideBlacklisted) list = list.filter(c => !blacklist.has(c.user));
      const q = searchQuery.trim().toLowerCase();
      if (q) list = list.filter(c => (c.body || "").toLowerCase().includes(q) || (c.user || "").toLowerCase().includes(q));
      return list;
    }, [comments, filter, showBookmarkedOnly, hideBlacklisted, blacklist, searchQuery, bookmarked]);

    // ── EXPORT ────────────────────────────────────────────────────────
    const exportCSV = () => {
      const rows = [["id","user","category","likes","bookmarked","blacklisted","whitelisted","body"]];
      for (const c of comments) {
        rows.push([c.id, c.user, c.category, c.likes ?? "", bookmarked.has(c.id)?"yes":"no", blacklist.has(c.user)?"yes":"no", whitelist.has(c.user)?"yes":"no", c.body || ""]);
      }
      const csv = rows.map(r => r.map(csvEscape).join(",")).join("\n");
      downloadBlob(csv, `comment-readerr-${jobId}.csv`, "text/csv;charset=utf-8;");
      setShowExportMenu(false);
    };
    const exportJSON = () => {
      const payload = {
        video: data.video, sentiment_summary: data.sentiment_summary, keywords: data.keywords,
        top_words: data.top_words, overall_summary: data.overall_summary,
        bookmarked_ids: Array.from(bookmarked), whitelisted_users: Array.from(whitelist), blacklisted_users: Array.from(blacklist),
        comments,
      };
      downloadBlob(JSON.stringify(payload, null, 2), `comment-readerr-${jobId}.json`, "application/json");
      setShowExportMenu(false);
    };
    const exportPDF = () => { setShowExportMenu(false); setTimeout(() => window.print(), 100); };

    // Top meaningful words/topics — comes from the backend (AI-extracted:
    // specific names, places, products, recurring topics — not filler words)
    const topWords = data.top_words || [];
    const maxWordCount = topWords.length > 0 ? topWords[0].count : 1;

    // Interactive reply generator state — per comment id
    const [replyState, setReplyState] = useState({}); // { [commentId]: { loading, text, copied } }

    // Manual override reply generator — creator pastes ANY comment text
    const [manualText, setManualText] = useState("");
    const [manualReply, setManualReply] = useState({ loading: false, text: "", copied: false, error: false });

    const handleManualReply = async () => {
      const text = manualText.trim();
      if (!text) return;
      setManualReply({ loading: true, text: "", copied: false, error: false });
      try {
        const res = await fetch(`${API_BASE}/comments/custom-reply`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ job_id: jobId, comment_text: text }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.message || "Failed");
        setManualReply({ loading: false, text: json.reply || "", copied: false, error: false });
      } catch {
        setManualReply({ loading: false, text: "", copied: false, error: true });
      }
    };
    const handleCopyManualReply = () => {
      navigator.clipboard?.writeText(manualReply.text).catch(()=>{});
      setManualReply(prev => ({ ...prev, copied: true }));
      setTimeout(() => setManualReply(prev => ({ ...prev, copied: false })), 1800);
    };

    const handleGenerateReply = async (comment) => {
      setReplyState(prev => ({ ...prev, [comment.id]: { loading: true, text: "", copied: false } }));
      try {
        const res = await fetch(`${API_BASE}/comments/${comment.id}/reply`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ job_id: jobId, comment_body: comment.body }),
        });
        const json = await res.json();
        setReplyState(prev => ({ ...prev, [comment.id]: { loading: false, text: json.reply || "", copied: false } }));
      } catch {
        setReplyState(prev => ({ ...prev, [comment.id]: { loading: false, text: "", copied: false, error: true } }));
      }
    };

    const handleCopyReply = (commentId, text) => {
      navigator.clipboard?.writeText(text).catch(()=>{});
      setReplyState(prev => ({ ...prev, [commentId]: { ...prev[commentId], copied: true } }));
      setTimeout(() => {
        setReplyState(prev => prev[commentId] ? ({ ...prev, [commentId]: { ...prev[commentId], copied: false } }) : prev);
      }, 1800);
    };

    const handleDismiss = async (commentId) => {
      setComments(prev=>prev.filter(c=>c.id!==commentId));
      try {
        await fetch(`${API_BASE}/comments/${commentId}`, {
          method:"DELETE",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ job_id: jobId }),
        });
      } catch {}
    };

    const chartData = Object.entries(data.sentiment_summary || {})
      .filter(([,v])=>v>0)
      .sort(([,a],[,b])=>b-a)
      .map(([name,value])=>({
        name: name.charAt(0).toUpperCase()+name.slice(1),
        value,
        color: CATEGORY_COLORS[name] || "#64748B"
      }));

    const video = data.video || {};

    // Show all filter buttons, including neutral if it has comments
    const filterOrder = ["all","positive","critical","questions","suggestions","urgent","business","spam","sarcasm","neutral"];

    return (
      <div className="max-w-6xl mx-auto px-4 md:px-6 py-6 md:py-10 animate-fade-up">

        {/* Filter Toolbar — FIXED: each button shows its comment count */}
        <div className="flex flex-wrap items-center gap-2 mb-6">
          {filterOrder.map(key=>{
            const meta = CATEGORY_META[key];
            if(!meta) return null;
            const count = categoryCounts[key] || 0;
            // Hide filter buttons with 0 comments (except "all")
            if(key !== "all" && count === 0) return null;
            const isActive = filter === key;
            return (
              <button key={key}
                onClick={()=>setFilter(key)}
                style={{backgroundColor: meta.base, opacity: isActive ? 1 : 0.72}}
                className={"filter-btn "+(isActive?"active":"")+" text-white text-xs md:text-sm font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5"}>
                <span>{meta.label}</span>
                <span className="bg-white/25 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center">
                  {count}
                </span>
              </button>
            );
          })}

          <button onClick={()=>setShowBookmarkedOnly(v=>!v)}
            style={{opacity: showBookmarkedOnly ? 1 : 0.72}}
            className={"filter-btn "+(showBookmarkedOnly?"active":"")+" bg-[#CA8A04] text-white text-xs md:text-sm font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5"}>
            <span>🔖 BOOKMARKED</span>
            <span className="bg-white/25 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center">{bookmarked.size}</span>
          </button>

          {blacklist.size > 0 && (
            <button onClick={()=>setHideBlacklisted(v=>!v)}
              style={{opacity: hideBlacklisted ? 1 : 0.72}}
              className={"filter-btn "+(hideBlacklisted?"active":"")+" bg-slate-700 text-white text-xs md:text-sm font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5"}>
              🚫 HIDE BLACKLISTED
            </button>
          )}

          <div className="relative print:hidden">
            <button onClick={()=>setShowExportMenu(v=>!v)}
              className="bg-[#10B981] text-white text-xs md:text-sm font-semibold px-3 py-1.5 rounded-full hover:bg-[#059669] transition-colors flex items-center gap-1.5">
              ⬇️ EXPORT
            </button>
            {showExportMenu && (
              <div className="absolute z-30 top-full mt-1 left-0 bg-white border border-slate-200 rounded-xl shadow-lg py-1 w-48">
                <button onClick={exportCSV} className="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2">📄 CSV (Comments)</button>
                <button onClick={exportJSON} className="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2">🗂️ JSON (Full Data)</button>
                <button onClick={exportPDF} className="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2">🖨️ PDF Report</button>
              </div>
            )}
          </div>

          <button onClick={()=>setShowMetrics(m=>!m)}
            className="ml-auto bg-[#64748B] text-white text-xs md:text-sm font-semibold px-3 py-1.5 rounded-full hover:bg-[#334155] transition-colors print:hidden">
            ⚙️ METRICS
          </button>
        </div>

        {/* Creator Brief — psychologically supportive, always visible regardless of METRICS toggle */}
        {data.creator_brief && (
          <div className="mb-6 rounded-2xl p-5 shadow-sm text-white"
            style={{background:"linear-gradient(120deg,#7C3AED,#4338CA)"}}>
            <h3 className="font-bold text-sm md:text-base mb-1.5 flex items-center gap-2">🧘 Creator Brief</h3>
            <p className="text-sm md:text-[15px] text-white/95 leading-relaxed">{data.creator_brief}</p>
          </div>
        )}

        {/* Genius Reply Zone — top 2-3 comments most worth a personal reply */}
        {data.priority_replies?.length > 0 && (
          <div className="mb-6 bg-white shadow-md border border-amber-200 rounded-2xl p-5">
            <h3 className="font-bold text-sm md:text-base mb-1 flex items-center gap-2">✨ Genius Reply Zone</h3>
            <p className="text-xs text-slate-400 mb-4">AI-isolated: the {data.priority_replies.length} comments most worth your personal attention right now</p>
            <div className="space-y-3">
              {data.priority_replies.map((c) => {
                const rs = replyState[c.id];
                const meta = CATEGORY_META[c.category] || CATEGORY_META.neutral;
                return (
                  <div key={c.id} className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                    <div className="flex flex-wrap items-center gap-2 mb-1.5">
                      <span className="font-semibold text-sm">{c.user}</span>
                      <span style={{backgroundColor:meta.base}} className="text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{meta.label}</span>
                      <span className="text-[11px] text-amber-700 font-medium ml-auto">{c.priority_reason}</span>
                    </div>
                    <p className="text-sm text-slate-700 mb-2">{c.body}</p>
                    <div className="flex items-center gap-3">
                      <button onClick={()=>handleGenerateReply(c)} disabled={rs?.loading}
                        className="text-xs font-semibold bg-[#F97316] text-white px-3 py-1.5 rounded-full hover:bg-[#EA580C] disabled:opacity-50 disabled:cursor-wait transition-colors">
                        {rs?.loading ? "✨ Generating..." : "✨ Genius Reply"}
                      </button>
                    </div>
                    {rs?.text && (
                      <div className="mt-3 bg-white border border-amber-200 rounded-lg p-3">
                        <p className="text-sm text-slate-700 mb-2">{rs.text}</p>
                        <button onClick={()=>handleCopyReply(c.id, rs.text)}
                          className="text-xs font-semibold bg-[#0EA5E9] text-white px-3 py-1 rounded-full hover:bg-[#0284C7] transition-colors">
                          {rs.copied ? "✓ Copied!" : "Copy"}
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Manual Reply Override — paste any comment text for an instant reply */}
        <div className="mb-6 bg-white shadow-md border border-slate-200 rounded-2xl p-5 print:hidden">
          <h3 className="font-bold text-sm md:text-base mb-1">✍️ Manual Reply Generator</h3>
          <p className="text-xs text-slate-400 mb-3">Paste any comment — from this video or anywhere else — to get an instant AI-drafted reply</p>
          <textarea value={manualText} onChange={e=>setManualText(e.target.value)} rows={2}
            placeholder="Paste a comment here..."
            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 transition-shadow resize-none" />
          <div className="flex items-center gap-3 mt-2">
            <button onClick={handleManualReply} disabled={manualReply.loading || !manualText.trim()}
              className="text-xs font-semibold bg-[#0EA5E9] text-white px-4 py-2 rounded-full hover:bg-[#0284C7] disabled:opacity-50 disabled:cursor-wait transition-colors">
              {manualReply.loading ? "Generating..." : "Generate Reply"}
            </button>
            {manualReply.error && <span className="text-xs text-red-500">Couldn't generate a reply. Try again.</span>}
          </div>
          {manualReply.text && (
            <div className="mt-3 bg-sky-50 border border-sky-200 rounded-lg p-3">
              <p className="text-sm text-slate-700 mb-2">{manualReply.text}</p>
              <button onClick={handleCopyManualReply}
                className="text-xs font-semibold bg-[#0EA5E9] text-white px-3 py-1 rounded-full hover:bg-[#0284C7] transition-colors">
                {manualReply.copied ? "✓ Copied!" : "Copy"}
              </button>
            </div>
          )}
        </div>

        {/* Metrics */}
        {showMetrics && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            {/* Video Card */}
            <div className="bg-[#2563EB] text-white rounded-2xl p-5 shadow-sm">
              <div className="flex gap-4">
                {video.thumbnail_url ? (
                  <img src={video.thumbnail_url} alt="thumb"
                    className="w-24 h-16 md:w-28 md:h-20 rounded-lg object-cover shrink-0" />
                ) : (
                  <div className="w-24 h-16 md:w-28 md:h-20 rounded-lg bg-white/20 flex items-center justify-center text-2xl shrink-0">🎬</div>
                )}
                <div className="min-w-0">
                  <h3 className="font-bold text-sm md:text-base truncate">{video.title || "—"}</h3>
                  <p className="text-xs md:text-sm text-white/80 truncate">{video.channel || "—"}</p>
                  <div className="flex gap-3 mt-2 text-xs md:text-sm font-semibold flex-wrap">
                    <span>VIEWS: {video.views?.toLocaleString() || "—"}</span>
                    <span>LIKES: {video.likes?.toLocaleString() || "—"}</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Engagement Card */}
            <div className="bg-[#F43F5E] text-white rounded-2xl p-5 shadow-sm flex flex-col justify-center">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs md:text-sm font-semibold">LIKES: {video.likes?.toLocaleString() || "—"}</span>
                <span className="text-xs md:text-sm font-semibold">COMMENTS: {video.comment_count?.toLocaleString() || "—"}</span>
              </div>
              <div className="w-full bg-white/25 rounded-full h-2 mb-1">
                <div className="bg-white h-2 rounded-full" style={{width:`${Math.min(video.engagement_ratio||0, 100)}%`}}></div>
              </div>
              <p className="text-xs text-white/85">Engagement Ratio: {video.engagement_ratio ?? "—"}%</p>
            </div>

            {/* Chart */}
            {BarChart && chartData.length > 0 && (
              <div className="bg-white shadow-md border border-slate-200 rounded-2xl p-5 md:col-span-2">
                <h3 className="font-bold text-sm md:text-base mb-3">Sentiment Distribution</h3>
                <div style={{width:"100%",height:220}}>
                  <ResponsiveContainer>
                    <BarChart data={chartData} margin={{top:4,right:8,left:-20,bottom:0}}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#E2E8F0" />
                      <XAxis dataKey="name" tick={{fontSize:11,fill:"#64748B"}} />
                      <YAxis tick={{fontSize:11,fill:"#64748B"}} allowDecimals={false} />
                      <Tooltip contentStyle={{borderRadius:8,fontSize:12}} />
                      <Bar dataKey="value" radius={[6,6,0,0]}>
                        {chartData.map((d,i)=><Cell key={i} fill={d.color}/>)}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              </div>
            )}

            {/* Overall Comment Summary — what viewers like, want, and what to add next */}
            {data.overall_summary && (data.overall_summary.viewers_like || data.overall_summary.viewers_want || data.overall_summary.video_suggestions?.length > 0) && (
              <div className="bg-white shadow-md border border-slate-200 rounded-2xl p-5 md:col-span-2">
                <h3 className="font-bold text-sm md:text-base mb-3">📝 Overall Comment Summary</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {data.overall_summary.viewers_like && (
                    <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-4">
                      <h4 className="font-semibold text-xs text-emerald-700 mb-1.5">🙂 What Viewers Like</h4>
                      <p className="text-sm text-slate-600">{data.overall_summary.viewers_like}</p>
                    </div>
                  )}
                  {data.overall_summary.viewers_want && (
                    <div className="bg-amber-50 border border-amber-100 rounded-xl p-4">
                      <h4 className="font-semibold text-xs text-amber-700 mb-1.5">💬 What Viewers Want</h4>
                      <p className="text-sm text-slate-600">{data.overall_summary.viewers_want}</p>
                    </div>
                  )}
                </div>
                {data.overall_summary.video_suggestion && (
                  <div className="mt-4 bg-sky-50 border border-sky-100 rounded-xl p-4">
                    <h4 className="font-semibold text-xs text-sky-700 mb-1.5">🎬 What To Make Next (and why)</h4>
                    <p className="text-sm text-slate-700">{data.overall_summary.video_suggestion}</p>
                  </div>
                )}
              </div>
            )}

            {/* Keywords */}
            {data.keywords?.length > 0 && (
              <div className="bg-white shadow-md border border-slate-200 rounded-2xl p-5">
                <h3 className="font-bold text-sm md:text-base mb-3">Topic Keywords</h3>
                <div className="flex flex-wrap gap-2">
                  {data.keywords.map((k,i)=>(
                    <span key={i} className="text-xs md:text-sm px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200"
                      style={{fontSize:11+(i%3)*2}}>#{k}</span>
                  ))}
                </div>
              </div>
            )}

            {/* Top Meaningful Words / Topics — AI-extracted: names, places, recurring topics only */}
            {topWords.length > 0 && (
              <div className="bg-white shadow-md border border-slate-200 rounded-2xl p-5 md:col-span-2">
                <h3 className="font-bold text-sm md:text-base mb-1">Top Words & Topics</h3>
                <p className="text-xs text-slate-400 mb-4">Specific names, places, and topics viewers keep bringing up — no filler words</p>

                {/* Word Cloud */}
                <div className="flex flex-wrap items-center gap-x-3 gap-y-2 justify-center bg-slate-50 rounded-xl p-6 mb-5 border border-slate-100">
                  {topWords.map((w,i)=>{
                    const ratio = w.count / maxWordCount;
                    const fontSize = 13 + ratio * 22; // 13px → 35px
                    const color = CLOUD_COLORS[i % CLOUD_COLORS.length];
                    return (
                      <span key={w.word+i}
                        className="font-bold leading-none"
                        style={{ fontSize: `${fontSize}px`, color, opacity: 0.55 + ratio*0.45 }}
                        title={`${w.word} — mentioned ${w.count}x`}>
                        {w.word}
                      </span>
                    );
                  })}
                </div>

                {/* Ranked list */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2">
                  {topWords.map(({word,count},i)=>(
                    <div key={word+i} className="flex items-center gap-2">
                      <span className="text-xs text-slate-400 w-5 text-right shrink-0">{i+1}.</span>
                      <span className="text-sm text-slate-700 font-medium truncate min-w-[70px]">{word}</span>
                      <div className="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden">
                        <div className="bg-[#0EA5E9] h-3 rounded-full" style={{width:`${Math.max((count/maxWordCount)*100, 4)}%`}}></div>
                      </div>
                      <span className="text-xs font-bold text-slate-500 w-8 text-right shrink-0">{count}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Audience Watchlist — repeat spammers to filter out, loyal viewers to track */}
            {(suggestedSpammers.length > 0 || suggestedLoyal.length > 0 || whitelist.size > 0 || blacklist.size > 0) && (
              <div className="bg-white shadow-md border border-slate-200 rounded-2xl p-5 md:col-span-2">
                <h3 className="font-bold text-sm md:text-base mb-1">Audience Watchlist</h3>
                <p className="text-xs text-slate-400 mb-4">Users who repeatedly spam get flagged for blacklisting; frequent positive commenters get flagged as loyal viewers</p>
                <div className={"grid grid-cols-1 gap-4 "+(data.superfans?.length>0 ? "md:grid-cols-3" : "md:grid-cols-2")}>
                  {data.superfans?.length > 0 && (
                    <div>
                      <h4 className="font-semibold text-xs text-sky-600 mb-2">🔥 Most Active (Superfans)</h4>
                      <div className="space-y-1.5">
                        {data.superfans.map(s=>(
                          <div key={s.user} className="flex items-center justify-between bg-sky-50 border border-sky-100 rounded-lg px-3 py-1.5">
                            <span className="text-sm text-slate-700 truncate">{s.user} <span className="text-xs text-sky-600">({s.comment_count} comments, {s.total_likes} likes)</span></span>
                            {!whitelist.has(s.user) && (
                              <button onClick={()=>addToWhitelist(s.user)} className="text-xs font-semibold text-white bg-sky-500 hover:bg-sky-600 px-2.5 py-1 rounded-full shrink-0 ml-2">Whitelist</button>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  <div>
                    <h4 className="font-semibold text-xs text-red-600 mb-2">🚫 Possible Repeat Spammers</h4>
                    {suggestedSpammers.length === 0 && blacklist.size === 0 && (
                      <p className="text-xs text-slate-400">None detected.</p>
                    )}
                    <div className="space-y-1.5">
                      {suggestedSpammers.map(s=>(
                        <div key={s.user} className="flex items-center justify-between bg-red-50 border border-red-100 rounded-lg px-3 py-1.5">
                          <span className="text-sm text-slate-700 truncate">{s.user} <span className="text-xs text-red-500">({s.spam} spam)</span></span>
                          <button onClick={()=>addToBlacklist(s.user)} className="text-xs font-semibold text-white bg-red-500 hover:bg-red-600 px-2.5 py-1 rounded-full shrink-0 ml-2">Blacklist</button>
                        </div>
                      ))}
                      {Array.from(blacklist).map(u=>(
                        <div key={u} className="flex items-center justify-between bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5">
                          <span className="text-sm text-slate-600 truncate">🚫 {u}</span>
                          <button onClick={()=>removeFromBlacklist(u)} className="text-xs font-semibold text-slate-500 hover:text-red-500 px-2 shrink-0 ml-2">Remove</button>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div>
                    <h4 className="font-semibold text-xs text-emerald-600 mb-2">⭐ Loyal Viewers</h4>
                    {suggestedLoyal.length === 0 && whitelist.size === 0 && (
                      <p className="text-xs text-slate-400">None detected yet.</p>
                    )}
                    <div className="space-y-1.5">
                      {suggestedLoyal.map(s=>(
                        <div key={s.user} className="flex items-center justify-between bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-1.5">
                          <span className="text-sm text-slate-700 truncate">{s.user} <span className="text-xs text-emerald-600">({s.count} comments)</span></span>
                          <button onClick={()=>addToWhitelist(s.user)} className="text-xs font-semibold text-white bg-emerald-500 hover:bg-emerald-600 px-2.5 py-1 rounded-full shrink-0 ml-2">Whitelist</button>
                        </div>
                      ))}
                      {Array.from(whitelist).map(u=>(
                        <div key={u} className="flex items-center justify-between bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5">
                          <span className="text-sm text-slate-600 truncate">⭐ {u}</span>
                          <button onClick={()=>removeFromWhitelist(u)} className="text-xs font-semibold text-slate-500 hover:text-red-500 px-2 shrink-0 ml-2">Remove</button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

        {/* Search within comments */}
        <div className="relative mb-4 print:hidden">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
          <input type="text" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)}
            placeholder="Search within loaded comments (keyword, phrase, or username)..."
            className="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-9 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 transition-shadow" />
          {searchQuery && (
            <button onClick={()=>setSearchQuery("")} aria-label="Clear search"
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-red-500 font-bold">✕</button>
          )}
        </div>

        {/* Comments Feed */}
        <div>
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-bold text-base md:text-lg">
              Comments Feed <span className="text-slate-400 font-normal text-sm">({filtered.length} shown)</span>
            </h3>
          </div>
          <div className="space-y-3 max-h-[600px] overflow-y-auto scrollbar-thin pr-1">
            {filtered.length === 0 ? (
              <div className="text-center py-16 text-slate-400 text-sm">No comments in this category.</div>
            ) : (
              filtered.map(c=>{
                const meta = CATEGORY_META[c.category] || CATEGORY_META.neutral;
                const rs = replyState[c.id];
                const isBookmarked = bookmarked.has(c.id);
                const isWhitelisted = whitelist.has(c.user);
                const isBlacklisted = blacklist.has(c.user);
                return (
                  <div key={c.id} className={"relative bg-[#F1F5F9] border rounded-xl p-4 pr-10 animate-fade-up "+(isBlacklisted?"border-red-300":"border-[#CBD5E1]")}>
                    <button onClick={()=>toggleBookmark(c.id)} aria-label="Bookmark"
                      className={"absolute top-3 right-3 text-lg transition-transform hover:scale-110 print:hidden "+(isBookmarked?"":"opacity-40 hover:opacity-100")}>
                      {isBookmarked ? "🔖" : "🏷️"}
                    </button>
                    <div className="flex items-start gap-3">
                      {c.avatar_url ? (
                        <img src={c.avatar_url} alt={c.user}
                          className="w-9 h-9 rounded-full object-cover shrink-0 border border-slate-200" />
                      ) : (
                        <div className="w-9 h-9 rounded-full bg-white flex items-center justify-center text-lg shrink-0 border border-slate-200">👤</div>
                      )}
                      <div className="min-w-0 flex-1">
                        <div className="flex flex-wrap items-center gap-2 mb-1">
                          <span className="font-semibold text-sm">{c.user}</span>
                          {isWhitelisted && <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded-full">⭐ LOYAL</span>}
                          {isBlacklisted && <span className="text-[10px] font-bold text-red-700 bg-red-100 px-1.5 py-0.5 rounded-full">🚫 BLACKLISTED</span>}
                          <span className="text-xs text-slate-400">{c.time_ago}</span>
                          <span style={{backgroundColor:meta.base}}
                            className="text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{meta.label}</span>
                        </div>
                        <p className="text-sm text-slate-700 break-words">{highlightMatch(c.body, searchQuery)}</p>
                        <div className="flex items-center gap-3 mt-2 text-xs text-slate-400 flex-wrap">
                          <span className="flex items-center gap-1">👍 {c.likes}</span>
                          {c.reply_count>0 && <span>💬 {c.reply_count} replies</span>}
                          {!isWhitelisted && (
                            <button onClick={()=>addToWhitelist(c.user)} className="hover:text-emerald-600 print:hidden">⭐ Whitelist user</button>
                          )}
                          {!isBlacklisted && (
                            <button onClick={()=>addToBlacklist(c.user)} className="hover:text-red-500 print:hidden">🚫 Blacklist user</button>
                          )}
                          <button onClick={()=>handleGenerateReply(c)} disabled={rs?.loading}
                            className="ml-auto text-[#0284C7] hover:text-[#0EA5E9] font-semibold disabled:opacity-50 disabled:cursor-wait print:hidden">
                            {rs?.loading ? "✨ Generating..." : "✨ Generate Reply"}
                          </button>
                        </div>

                        {rs?.text && (
                          <div className="mt-3 bg-white border border-sky-200 rounded-lg p-3">
                            <p className="text-xs font-semibold text-sky-600 mb-1">Suggested Reply</p>
                            <p className="text-sm text-slate-700 mb-2">{rs.text}</p>
                            <button onClick={()=>handleCopyReply(c.id, rs.text)}
                              className="text-xs font-semibold bg-[#0EA5E9] text-white px-3 py-1 rounded-full hover:bg-[#0284C7] transition-colors">
                              {rs.copied ? "✓ Copied!" : "Copy"}
                            </button>
                          </div>
                        )}
                        {rs?.error && (
                          <p className="text-xs text-red-500 mt-2">Couldn't generate a reply. Try again.</p>
                        )}
                      </div>
                    </div>
                    <button onClick={()=>handleDismiss(c.id)} aria-label="Dismiss"
                      className="absolute bottom-3 right-3 text-[#94A3B8] hover:text-[#EF4444] transition-colors font-bold text-sm print:hidden">✕</button>
                  </div>
                );
              })
            )}
          </div>
        </div>
      </div>
    );
  }

  // ── APP ROOT ─────────────────────────────────────────────────────────
  function App() {
    const [view, setView] = useState("home");
    const [progress, setProgress] = useState(null);
    const [jobId, setJobId] = useState(null);
    const [resultData, setResultData] = useState(null);
    const [errorMsg, setErrorMsg] = useState("");
    const pollRef = useRef(null);

    const stopPolling = () => {
      if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
    };

    const handleReset = useCallback(() => {
      stopPolling();
      setView("home");
      setJobId(null);
      setResultData(null);
      setProgress(null);
      setErrorMsg("");
    }, []);

    const handleAnalyze = useCallback(async (url) => {
      stopPolling();
      setView("loading");
      setProgress({ step: 1, label: "Fetching public video comments..." });

      let res, json;
      try {
        res = await fetch(`${API_BASE}/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        json = await res.json();
      } catch (err) {
        setErrorMsg("Could not reach the server. Is the backend running?");
        setView("error");
        return;
      }

      if (!res.ok) {
        setErrorMsg(json.message || "Invalid request.");
        setView("error");
        return;
      }

      const jid = json.job_id;
      setJobId(jid);

      // FASTER polling: 800ms instead of 1500ms
      pollRef.current = setInterval(async () => {
        try {
          const r = await fetch(`${API_BASE}/results/${jid}`);
          const data = await r.json();

          if (data.status === "processing") {
            setProgress(data.progress);
          } else if (data.status === "complete") {
            stopPolling();
            setResultData(data);
            setView("results");
          } else if (data.status === "failed") {
            stopPolling();
            setErrorMsg(data.message || "Analysis failed.");
            setView("error");
          }
        } catch {
          stopPolling();
          setErrorMsg("Lost connection to the server.");
          setView("error");
        }
      }, 800); // ← was 1500ms, now 800ms
    }, []);

    useEffect(() => () => stopPolling(), []);

    return (
      <div className="min-h-screen flex flex-col">
        <Header view={view} onReset={handleReset} />
        <main className="flex-1">
          {view==="home"    && <HomeView onAnalyze={handleAnalyze} />}
          {view==="loading" && <LoadingView progress={progress} />}
          {view==="results" && <ResultsView jobId={jobId} data={resultData} />}
          {view==="error"   && <ErrorView message={errorMsg} onReset={handleReset} />}
        </main>
        <footer className="text-center text-xs text-slate-400 py-6">
          Comment Readerr
        </footer>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
</body>
</html>
